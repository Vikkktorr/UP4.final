<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Автосервис: запись к мастеру, учёт автомобилей, клиентов, мастеров и услуг.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Автосервис">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Автосервис</title>
  <link rel="manifest" href="manifest.json">

  <!-- Экран-заглушка: виден, пока загружается и запускается приложение,
       вместо белого экрана. Убирается по событию первого кадра Flutter. -->
  <style>
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #f9f9ff;
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
      transition: opacity .3s;
    }
    #splash h1 { margin: 0; font-size: 28px; font-weight: 500; color: #191c20; }
    #splash .spinner {
      width: 40px; height: 40px;
      border: 4px solid #d6e3ff; border-top-color: #415f91;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Загрузка приложения">
    <h1>Автосервис</h1>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
